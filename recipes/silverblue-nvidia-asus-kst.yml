name: silverblue-nvidia-asus-kst
description: Imagen para Plata con software de Asus, Keybase, Syncthing y Tailscale
base-image: ghcr.io/ublue-os/silverblue-nvidia
image-version: "44"
modules:
  - type: files
    files:
      - source: system
        destination: /
        
  - type: dnf
    repos:
      copr:
        - lukenukem/asus-linux
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      packages:
        - syncthing
        - tailscale
        - ncdu
        - asusctl
        - asusctl-rog-gui
        - gnome-tweaks
        - waydroid
        - waydroid-selinux

  - type: script
    scripts:
      - prepare-keybase.sh

  - type: script
    snippets:
      - "chmod +x /usr/bin/sync-keybase"
      - "mkdir -p /usr/lib/systemd/user/default.target.wants"
      - "ln -sf /usr/lib/systemd/user/sync-keybase.service /usr/lib/systemd/user/default.target.wants/sync-keybase.service"
