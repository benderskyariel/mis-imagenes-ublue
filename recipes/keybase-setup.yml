# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

# Shared by every recipe: copies files/system into the image and wires up the
# Keybase-in-$HOME sync service (see files/scripts/prepare-keybase.sh).
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - prepare-keybase.sh

  - type: script
    snippets:
      - "chmod +x /usr/bin/sync-keybase"
      - "mkdir -p /usr/lib/systemd/user/default.target.wants"
      - "ln -sf /usr/lib/systemd/user/sync-keybase.service /usr/lib/systemd/user/default.target.wants/sync-keybase.service"
