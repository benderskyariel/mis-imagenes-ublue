name: silverblue-nvidia-kst
description: Imagen base para Oro con Keybase, Syncthing y Tailscale
base-image: ghcr.io/ublue-os/silverblue-nvidia
image-version: 44
modules:
  - type: rpm-ostree
    repos:
      - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      - https://prerelease.keybase.io/keybase.repo
    install:
      - syncthing
      - tailscale
      - keybase
