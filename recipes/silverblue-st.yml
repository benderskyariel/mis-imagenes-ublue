name: silverblue-st
description: Imagen base para off con Keybase, Syncthing y Tailscale
base-image: ghcr.io/ublue-os/silverblue-main
image-version: "44"
modules:
  - type: files

  - type: dnf
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      packages:
        - syncthing
        - tailscale
        - ncdu
        - python3-tkinter
        - gnome-tweaks

  - type: script
    scripts:
      - prepare-keybase.sh

  - type: script
    inline: |
      # Dar permisos de ejecución al script de sincronización local
      chmod +x /usr/bin/sync-keybase
      # Crear el enlace simbólico para que el servicio de Systemd esté activo por defecto para tu usuario
      mkdir -p /usr/lib/systemd/user/default.target.wants
      ln -sf /usr/lib/systemd/user/sync-keybase.service /usr/lib/systemd/user/default.target.wants/sync-keybase.service
